
# Active environment (dev / stg / prod)
env=prod

# API URLs
dev.api.baseUrl=https://dev.api.com
stg.api.baseUrl=https://stg.api.com
prod.api.baseUrl=https://reqres.in/api/

# UI URLs
dev.ui.baseUrl=https://dev.ui.com
stg.ui.baseUrl=https://stg.ui.com
prod.ui.baseUrl=https://www.saucedemo.com

# API key
REQRES_API_KEY=

# Default browser to run tests
browser=chrome

# Supported browsers
supportedBrowsers=chrome,firefox,edge,safari


# Wait Configuration (in seconds / ms)

implicitWait=2
explicitWait=10
pollingInterval=500